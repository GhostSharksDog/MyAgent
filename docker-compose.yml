# ============================================================
# Legacy 拆分部署编排
#
#   web (Vite 静态站) ──→ api ──→ rag      独立检索服务（CPU 密集）
#                          │
#                          ├──→ redis    会话 + 任务队列（跨进程共享状态）
#                          │
#                          └──→ worker   独立任务消费者
#
# 【这份文件最重要的部分是那些"必须成对出现"的环境变量】
#
# 拆服务的绝大部分事故不是代码写错，而是**配置组合不自洽** ——
# 服务起得来、日志正常、接口返回 200，只是拓扑和你以为的不一样。
# 下面每一处都用注释标出了"为什么必须是这个值"。
# ============================================================

name: legacy

# ============================================================
# 公共配置
# ============================================================
x-app-env: &app-env
  # ---------- 大模型 ----------
  LLM_API_KEY: ${LLM_API_KEY:?请在 .env 中设置 LLM_API_KEY}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
  LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # 结构化日志：容器里的日志只能靠采集器收，彩文本对它没有意义（T05）
  LOG_FORMAT: ${LOG_FORMAT:-json}

  # ---------- 访问控制：这两个值必须与启动命令里的 --host 一致 ----------
  #
  # 【这是本项目最"安静"的一个坑】
  # 访问控制检查（app/api/auth.py）判定"是否对外暴露"依据的是 **APP_HOST**，
  # 而真正决定监听地址的是 uvicorn 的 `--host`（镜像 CMD 与下面的 rag 命令里
  # 都是 0.0.0.0）。两者不一致时的后果是最糟的一种：**容器监听所有网卡，
  # 而启动日志说"仅监听回环地址，未启用密钥鉴权（本地开发默认形态）"** ——
  # 一个说反了的结论比没有结论危险得多。
  # 所以这里显式写 0.0.0.0（说真话），随之而来的就是下面那条密钥要求。
  # test_service_split.py 里有断言钉住这一对，改一边不改另一边会红。
  APP_HOST: "0.0.0.0"

  # 对外暴露就必须有密钥：没有它，`docker compose up` 会**拒绝启动**。
  #
  # 【为什么让它起不来，而不是打条 WARNING】
  # WARNING 的设计意图就是"不阻断流程"，而这里的后果是
  # "任何能访问到 8000 的人都能用你的模型额度、读你的文件工作区、看会话历史"。
  # 确实有网关做鉴权时，显式认领风险：
  #   SECURITY_ALLOW_UNAUTHENTICATED_EXPOSURE=true
  #
  # 生成：python -c "import secrets;print(secrets.token_urlsafe(32))"
  # 写进 .env 的 SECURITY_API_KEY 后重启 compose。界面打开时会提示
  # "这台服务要求访问密钥"，把它填进「设置 → 访问控制」即可。
  SECURITY_API_KEY: ${SECURITY_API_KEY:?请在 .env 中设置 SECURITY_API_KEY —— 对外暴露的服务不能没有访问密钥（或用 SECURITY_ALLOW_UNAUTHENTICATED_EXPOSURE=true 显式认领风险）}

  # ---------- 会话：必须跨进程共享 ----------
  # api 多副本时，会话写在一个副本的内存里，下一个请求打到别的副本就读不到 ——
  # 表现为"用户偶尔丢历史"。所以容器里绝不能是 memory。
  SESSION_BACKEND: redis

  # ---------- 任务队列：必须跨进程共享 ----------
  # worker 是独立进程，只认 redis。这是它唯一能收到任务的方式。
  TASK_BACKEND: redis

  # ---------- 检索 ----------
  # 指向独立的 RAG 服务。**不能留空** ——
  # 留空不会报错，agent 会在自己进程里另建一份索引，
  # 服务一切正常，但拆分带来的资源隔离/独立扩容全部失效。
  RAG_SERVICE_URL: http://rag:8001
  RAG_MODE: ${RAG_MODE:-hybrid}
  RAG_RERANKER: ${RAG_RERANKER:-lexical}
  RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.0}

  REDIS_URL: redis://redis:6379/0

# 【这里用 YAML 的**合并键**（`<<:`）而不是直接写别名】
#
# 这个锚点本身已经是一个映射（`redis: {condition: ...}`），所以引用它的地方
# 必须是 `<<: *depends-on-redis`（把键合并进来）。写成 `redis: *depends-on-redis`
# 会得到 `redis: {redis: {condition: ...}}` —— 多套了一层，
# compose 校验直接报错：
#
#     services.api.depends_on.redis additional properties 'redis' not allowed
#
# 这个错从写出来那天起就在文件里，而**一直到真正执行 `docker compose up`
# 才被发现**（技术债 T22 的具体代价：编排文件是代码，不跑就等于没写）。
x-depends-on-redis: &depends-on-redis
  redis:
    condition: service_healthy

services:
  # ----------------------------------------------------------
  # Redis：跨进程共享状态的唯一点
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    # appendonly：重启不丢任务与会话。
    # 默认的 RDB 快照是按时间间隔落盘的，容器一重启就会丢掉最近几秒的写入。
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      # 健康检查必须先于 depends_on 生效 ——
      # 否则 api 会在 Redis 还没就绪时启动，连接失败后降级到内存，
      # 而"降级"在这里意味着多副本共享**静默失效**。
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ----------------------------------------------------------
  # RAG 检索服务：CPU 密集，可独立扩容
  #
  # ⚠ **它没有访问控制**（鉴权中间件只挂在 agent 服务上），
  # 所以它**刻意不 publish 端口**：只在 compose 网络内可达。
  # 要把它暴露出去，先给它加鉴权，而不是加一行 `ports:` ——
  # 那会变成一个任何人都能打的、无鉴权的检索接口（能读到语料内容）。
  # test_service_split.py 里有断言盯着这一点。
  # ----------------------------------------------------------
  rag:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command:
      - uvicorn
      - app.rag_service.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
    environment:
      <<: *app-env
    volumes:
      # 语料是运行时数据（含简历），挂载而不是打进镜像。
      # 同时让 api / rag / worker 三个容器看到**同一份**语料 ——
      # 否则会出现"agent 检索到 A 版本、RAG 服务索引的是 B 版本"这种错位。
      - ./data:/app/data
    healthcheck:
      # 用 python 而不是 curl：slim 镜像里没有 curl，
      # 硬装一个只为健康检查不值得。任何装了 Python 的镜像都能这么写。
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------
  # API 服务：IO 密集（等模型），可多副本
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      <<: *app-env
      # 前端产物在镜像里的位置（镜像的目录结构与仓库不同）。
      # 不设也不会报错 —— 它会安静地"只提供 API"，于是容器 healthy、
      # 接口 200、界面 404。所以这个变量与 Dockerfile 里的 COPY 是一对。
      WEB_DIST: /app/apps/web/dist
      # ⚠ 这个值必须与 worker 服务成对出现：
      #   api 里 false（只投递） + worker 服务在跑（只消费）
      # 反过来的组合（两个都消费）不会报错，只会让任务被执行两次。
      TASK_RUN_WORKERS_IN_API: "false"
    ports:
      # 只有这个端口对外。它是唯一的入口：界面、API、文档都在上面。
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      <<: *depends-on-redis
      rag:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Worker：只消费任务，不对外暴露端口
  # ----------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "app.worker_main"]
    environment:
      <<: *app-env
    volumes:
      - ./data:/app/data
    depends_on:
      <<: *depends-on-redis
    # 【为什么没有 healthcheck，也没有 ports】
    # worker 没有监听端口，"健康"的唯一判据是"它在消费队列"。
    # 用 HTTP 探针去测它会得到一个永远失败的检查 —— 那比没有检查更糟，
    # 因为它会让编排系统不断重启一个其实正常的容器。
    #
    # 真正的 worker 健康检查应该看**队列积压深度**（redis LLEN）或
    # "最后一次成功处理任务的时间"，那属于监控指标而不是容器探针。
    #
    # 它现在也没有多副本：worker 之间抢同一个队列是安全的（BRPOP 是原子的），
    # 但任务语义是**至多一次**，多副本会放大"崩溃即丢任务"的窗口。
    # 升级到 Redis Streams + 消费者组之后再谈扩容。
    restart: unless-stopped

volumes:
  redis-data:
