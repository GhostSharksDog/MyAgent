<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Legacy 通用 AI 助手：一起整理资料、核验计算与制定计划。"
    />
    <title>Legacy · AI 助手</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script id="theme-init">
      /* 首次绘制前应用已有偏好；无偏好、非法值或存储不可用均为浅色。
         与 src/lib/theme.ts 保持一致，测试直接执行此脚本核对两条路径。 */
      ;(function () {
        try {
          var stored = localStorage.getItem('legacy.theme')
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'light'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>这个控制台需要启用 JavaScript 才能连接后端 Agent 服务。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
