name: Build Windows desktop ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PIP_TARGET: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: pip
          cache-dependency-path: scripts/desktop-requirements.lock
      - uses: pnpm/action-setup@v4
        with:
          version: '10.12.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install isolated locked desktop environment
        run: |
          python -m venv data/desktop-build-env
          data/desktop-build-env/Scripts/python.exe -m pip install -r scripts/desktop-requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          data/desktop-build-env/Scripts/python.exe -m pip install --no-deps -e services/api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          data/desktop-build-env/Scripts/python.exe -m pip check
      - name: Build frontend
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
      - name: Build audited Windows bundle
        run: data/desktop-build-env/Scripts/python.exe scripts/build_desktop.py --node (Get-Command node).Source
      - uses: actions/upload-artifact@v4
        with:
          name: Legacy-Windows-x64
          path: |
            data/releases/Legacy-Windows-x64.zip
            data/releases/Legacy-Windows-x64.zip.sha256
          if-no-files-found: error
