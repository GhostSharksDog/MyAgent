name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PIP_TARGET: ''
      AGENT_PROFILE: general
      AGENT_WORKSPACE_ROOT: ''
      AGENT_CORPUS_PATHS: ''
      AGENT_CORPUS_INCLUDE_SEED: 'false'
      AGENT_FILE_WRITE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - uses: pnpm/action-setup@v4
        with:
          version: '10.12.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install locked runtime and development tools
        run: python -m pip install -r services/api/requirements.lock -e "./services/api[dev]" -c services/api/requirements.lock
      - name: Verify runtime lock
        run: python scripts/lock_deps.py --check
      - name: Check format without modifying files
        run: python -m ruff format services/api scripts/eval_agent.py scripts/eval_rag.py --check
      - name: Lint
        run: python -m ruff check services/api scripts/eval_agent.py scripts/eval_rag.py
      - name: Backend offline tests
        run: python -m pytest services/api/tests -q --junitxml=backend-tests.xml
      - name: Public RAG sample evaluation
        run: python scripts/eval_rag.py --compare --sample --json-out data/rag-eval.json
      - name: Validate general public RAG evidence
        run: python scripts/eval_rag.py --validate --dataset general
      - name: General public RAG evaluation
        run: python scripts/eval_rag.py --compare --dataset general --json-out data/rag-general-eval.json
      - name: Agent evaluation with synthetic model and real orchestration
        run: python scripts/eval_agent.py --offline
      - name: Install frontend
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        working-directory: apps/web
        run: pnpm test
      - name: Typecheck
        working-directory: apps/web
        run: pnpm run typecheck
      - name: Build frontend
        working-directory: apps/web
        run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-check-results
          path: |
            backend-tests.xml
            data/rag-eval.json
            data/rag-general-eval.json
            data/agent-eval/report.json
            data/agent-eval/report.md
            data/agent-eval/records.json
            apps/web/dist
          if-no-files-found: warn
