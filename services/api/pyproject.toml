[project]
name = "legacy-api"
version = "0.1.0"
description = "Legacy 求职/招聘 AI Agent —— 手写内核的 Agent 服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "redis>=5.2",
    "scikit-learn>=1.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
# pyyaml 用于**校验 docker-compose.yml 的拓扑自洽性**（见 test_service_split.py）。
# 它必须显式声明：测试如果依赖未声明的传递依赖，会在换了依赖解析结果时
# 突然失败，而且失败原因看起来和测试本身毫无关系。
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6.0",
]

# ============================================================
# Ruff：lint + format（比 flake8+isort+black 快一个数量级）
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort：import 排序
    "B",        # bugbear：常见逻辑陷阱
    "UP",       # pyupgrade：用新语法
    "ASYNC",    # 异步反模式（在 async 函数里用阻塞调用）
    "RUF",
]
ignore = [
    "E501",     # 行长交给 formatter 处理
    # RUF001/2/3 会把中文全角标点（，。「」）当作"易混淆 Unicode 字符"报错。
    # 本项目的文档与注释是中文，全角标点是正确写法，属于误报，直接关闭。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # 测试里允许 assert False 风格

[tool.ruff.format]
quote-style = "double"

# ============================================================
# mypy：类型检查。对 Agent 项目尤其重要——
# 工具参数是动态 JSON，类型错了运行时才炸。
# ============================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "tiktoken.*"]
ignore_missing_imports = true

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# 【为什么这里**没有** -q —— 这是由一次真实困惑换来的】
#
# 原来写的是 `-q --strict-markers`。问题是用户很自然会再敲一个 `-q`，
# 两个叠成 `-qq`，于是**连最后的 "605 passed" 汇总行也被压掉了** ——
# 屏幕上只剩满屏的点号，人无法确定到底是通过还是没跑到。
#
# 一个"看不出结论"的测试输出是缺陷，不是风格问题：
# 它会让人靠数点号、或者干脆假设"没红就是过了"来判断，
# 而"没红"和"跑完了"是两件事（中途被杀掉也是没红）。
#
# `-ra` 的作用相反：**显示所有非通过用例的简要原因**
# （失败、跳过、xfail 各一行）。这才是默认该有的信息量 ——
# 通过时给一个明确的数字，出问题时给明确的列表。
# 想要更安静可以自己加 -q，那时仍然会保留汇总行。
addopts = "-ra --strict-markers"
markers = [
    "live: 需要真实调用大模型 API 的测试（默认跳过，用 -m live 显式开启）",
    "slow: 耗时较长的测试",
]
